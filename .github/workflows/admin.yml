name: Admin Panel CI

on:
  pull_request:
    paths:
      - "admin/**"
      - ".github/workflows/admin.yml"
  push:
    branches: [dev, main]
    paths:
      - "admin/**"
      - ".github/workflows/admin.yml"

jobs:
  build-and-test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

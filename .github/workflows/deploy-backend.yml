name: Deploy Backend (Fly.io)

# OPS-3: auto-deploy the dev branch. Runs after backend.yml's own lint/test
# job would already have gated the PR that landed on dev -- this workflow
# only builds+deploys, it doesn't re-lint/re-test.
on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-backend-dev
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --app the-crane-api
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

name: Web Client CI

on:
  pull_request:
    paths:
      - "web-client/**"
      - "backend/openapi.json"
      - ".github/workflows/web-client.yml"
  push:
    branches: [dev, main]
    paths:
      - "web-client/**"
      - "backend/openapi.json"
      - ".github/workflows/web-client.yml"

jobs:
  build-and-test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # WEB-1: catches src/api/generated.ts drifting from the checked-in
      # backend/openapi.json spec snapshot (regenerates to a temp file and
      # diffs). Deliberately checks against the committed snapshot, not a
      # live backend -- no service containers needed here, at the cost of
      # only catching "generated.ts is stale vs the snapshot" rather than
      # "vs the CURRENT backend". backend.yml's "OpenAPI snapshot" step
      # closes that other half by checking the snapshot itself against the
      # live backend code (no DB/Redis needed for that either -- see
      # backend/scripts/dump_openapi.py).
      - name: Check generated OpenAPI client is in sync
        run: npm run client:check

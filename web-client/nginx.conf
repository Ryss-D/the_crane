server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router) — any path that isn't a real static
    # file falls back to index.html so the app's own router handles it.
    location / {
        try_files $uri /index.html;
    }

    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}

[project]
name = "the-crane-backend"
version = "0.1.0"
description = "The Crane — FastAPI dispatch backend for tow trucks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "redis",
    "firebase-admin",
    "greenlet",
    "httpx>=0.28.1",
    "sentry-sdk[fastapi]>=2.68.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "aiosqlite",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy's async engine bridges every `await` through a greenlet switch;
# without this, coverage.py's tracer loses the frame across that switch and
# misreports huge swaths of straight-line code in every async endpoint/service
# as uncovered even though tests exercise it (verified: default config showed
# app/api/jobs.py at 49%, jumps to 95% with this on, same test suite).
concurrency = ["greenlet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Static analysis configuration.
# Base rule set: flutter_lints. Riverpod-specific rules come from
# riverpod_lint via the custom_lint analyzer plugin (`dart run custom_lint`).
include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    prefer_single_quotes: true
